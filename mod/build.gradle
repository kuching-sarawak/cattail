plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'net.kuching.cattail'

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    // Plasmo Voice is published on the Modrinth Maven; only the maven.modrinth group resolves there.
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// The exact Plasmo Voice jar nested by jarJar, resolved on its own so its sha256 can be checked.
configurations {
    bundledVoice { canBeConsumed = false; canBeResolved = true; transitive = false }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            // -PquickPlay=<host:port>: join that server at once (a live check of the join path and
            // the update notice against a dev server; scripts/e2e-update-notice.sh).
            if (providers.gradleProperty('quickPlay').isPresent()) {
                programArguments.addAll('--quickPlayMultiplayer', providers.gradleProperty('quickPlay').get())
            }
        }
        // Dedicated-server smoke test of the universal jar (scripts/smoke-server.sh); eula in run/server.
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        cattail {
            sourceSet sourceSets.main
        }
    }
}

// -PnoVoice: dev runs (runClient, runServer, the smoke tests) without Plasmo Voice on the
// classpath, as a game running the no-voice jar. The nested jar in the full jar is unaffected.
def noVoiceRun = providers.gradleProperty('noVoice').isPresent()

dependencies {
    // Plasmo Voice (LGPL-3.0, unmodified upstream release) nested in the jar via NeoForge jar-in-jar.
    jarJar("maven.modrinth:plasmo-voice:${plasmo_voice_version}")
    if (!noVoiceRun) {
        runtimeOnly("maven.modrinth:plasmo-voice:${plasmo_voice_version}")
    }
    bundledVoice "maven.modrinth:plasmo-voice:${plasmo_voice_version}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // slf4j is provided by the game at runtime; tests run without it, so add the API (same version NeoForge pins).
    // On the compile classpath too: HelperProcessTest records log calls through a Logger proxy.
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    // NeoForge + night-config for CattailConfigTest (ModConfigSpec.correct on an empty config).
    testImplementation files(sourceSets.main.compileClasspath)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Werror']
}

def replaceProperties = [
        minecraft_version   : minecraft_version,
        neo_version         : neo_version,
        loader_version_range: loader_version_range,
        neo_version_range   : neo_version_range,
        mod_id              : mod_id,
        mod_version         : mod_version,
]

// The bundled helpers and their checksums are generated by scripts/build.sh (never committed).
// Without them the jar would install nothing at runtime, so fail early, unless -PskipHelper is
// given (unit tests and IDE runs do not need the helpers).
def helperResourceDir = file('src/main/resources/helper')
def skipHelper = providers.gradleProperty('skipHelper').isPresent()
// The bundled helpers, one per supported player platform. Mirrors HelperTarget in the mod,
// HELPER_TARGETS in scripts/build.sh and HELPER_ENTRIES (rule helper_entries) in
// scripts/release-public.sh; all four change together, or the jar misses a helper the mod looks
// for, or carries one a check refuses. The processResources check and the jar allowlist below
// both read this table.
def helperTargets = [[dir: 'windows-amd64', binary: 'cattail-helper.exe'],
                     [dir: 'linux-amd64', binary: 'cattail-helper'],
                     [dir: 'darwin-arm64', binary: 'cattail-helper']]
// Each target's binary and cattail-helper.sha256, relative to helper/. As String here and in the
// allowlist below: a GString never equals a String, so `in` would match no jar entry.
def helperResourceFiles = helperTargets.collectMany {
    ["${it.dir}/${it.binary}" as String, "${it.dir}/cattail-helper.sha256" as String]
}
// Resources the old baked-in setup wrote: the key, the player tag, the probe targets and the
// specs prefix. A checkout may still hold them, and the generic jar must never carry them, so
// they are left out however the jar is built (scripts/build.sh also deletes them). No empty
// directories either: an excluded file would otherwise leave its folder behind as a jar entry.
def legacyDeploymentResources = ['helper/authkey.txt', 'helper/tag.txt', 'helper/probe-targets.txt',
                                 'cattail/build.properties']

processResources {
    inputs.properties replaceProperties
    exclude legacyDeploymentResources
    includeEmptyDirs = false
    doFirst {
        if (!skipHelper) {
            def missing = helperResourceFiles.findAll {
                !new File(helperResourceDir, it).isFile()
            }
            if (!missing.isEmpty()) {
                throw new GradleException("Cattail: missing bundled helper resource(s) ${missing} in " +
                        "${helperResourceDir} (expected ${helperResourceFiles}). Run scripts/build.sh " +
                        "(which builds the helpers and writes them), or pass -PskipHelper to build/test " +
                        "without the helpers.")
            }
        }
    }
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
    from(rootProject.file('../THIRD_PARTY_NOTICES.md')) {
        into 'META-INF/licenses'
    }
    from(rootProject.file('../helper/THIRD_PARTY_LICENSES.md')) {
        into 'META-INF/licenses'
    }
    from(rootProject.file('../LICENSE')) {
        into 'META-INF/licenses'
    }
}

// Byte-reproducible jars: same sources + same helper binaries give the same jar sha256.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// -Pprobe marks a probe build: only a jar with Cattail-Probe: true lets inject accept probe.targets.
def probeBuild = providers.gradleProperty('probe').isPresent()

def manifestAttributes = [
        'Specification-Title'   : 'cattail',
        'Specification-Version' : mod_version,
        'Implementation-Title'  : 'cattail',
        'Implementation-Version': mod_version,
        // java -jar cattail-<ver>.jar inject deployment.properties; NeoForge ignores it.
        'Main-Class'            : 'net.kuching.cattail.deploy.Inject',
]
if (probeBuild) {
    manifestAttributes['Cattail-Probe'] = 'true'
}

jar {
    manifest {
        attributes(manifestAttributes)
    }
}

// The no-voice jar: the full jar without the nested Plasmo Voice (and without its LGPL-3.0 and
// GPL-3.0 texts, which only it needs), same manifest, every other entry byte for byte. Plasmo
// Voice is an optional dependency in neoforge.mods.toml, so this jar loads with or without a
// standalone Plasmo Voice in mods.
def noVoiceExcludes = ['META-INF/jarjar/**', 'META-INF/licenses/LGPL-3.0.txt', 'META-INF/licenses/GPL-3.0.txt']
tasks.register('noVoiceJar', Jar) {
    description = 'Builds the no-voice jar: the full jar without the nested Plasmo Voice.'
    group = 'build'
    dependsOn 'jar'
    archiveClassifier = 'novoice'
    includeEmptyDirs = false
    manifest {
        attributes(manifestAttributes)
    }
    from(zipTree(tasks.named('jar', Jar).flatMap { it.archiveFile })) {
        exclude noVoiceExcludes
        exclude 'META-INF/MANIFEST.MF'
    }
}

tasks.named('assemble') {
    dependsOn 'noVoiceJar'
}

// Supply-chain gate: the Plasmo Voice jar resolved from Modrinth must match the pinned sha256
// before it is nested in the Cattail jar.
def sha256Hex = { InputStream input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    byte[] buffer = new byte[65536]
    int read
    while ((read = input.read(buffer)) != -1) {
        digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}

tasks.register('verifyBundledVoiceChecksum') {
    description = 'Checks the resolved Plasmo Voice jar against plasmo_voice_sha256.'
    group = 'verification'
    def voiceFiles = configurations.bundledVoice
    def expected = plasmo_voice_sha256
    inputs.files voiceFiles
    inputs.property 'expectedSha256', expected
    doLast {
        def actual = voiceFiles.singleFile.withInputStream { sha256Hex(it) }
        if (actual != expected) {
            throw new GradleException("Cattail: bundled Plasmo Voice jar sha256 ${actual} != expected ${expected}")
        }
    }
}

tasks.named('jar') {
    dependsOn 'verifyBundledVoiceChecksum'
}

// Dev runs load the same Plasmo Voice jar from runtimeOnly, so they go through the gate too.
// matching + configureEach is lazy, so it applies whenever ModDevGradle registers the run tasks.
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn 'verifyBundledVoiceChecksum'
}

// The built jar must carry the jarJar metadata for plasmo-voice, the nested jar byte for byte,
// and the license files the LGPL-3.0 and the helper's Go modules require next to it. It is
// generic: no deployment file or anything else under cattail/, nothing under helper/ but the
// helperTargets directories with their binaries and checksums, inject as its Main-Class, the
// probe marker only with -Pprobe.
tasks.register('verifyBundledVoiceJar') {
    description = 'Checks that the built jar nests the unmodified Plasmo Voice jar.'
    group = 'verification'
    dependsOn 'jar'
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def expected = plasmo_voice_sha256
    def probe = probeBuild
    inputs.file jarFile
    inputs.property 'expectedSha256', expected
    inputs.property 'probe', probe
    doLast {
        def path = jarFile.get().asFile
        new java.util.jar.JarFile(path).withCloseable { zip ->
            ['META-INF/licenses/LGPL-3.0.txt', 'META-INF/licenses/GPL-3.0.txt',
             'META-INF/licenses/THIRD_PARTY_NOTICES.md', 'META-INF/licenses/THIRD_PARTY_LICENSES.md',
             'META-INF/licenses/LICENSE'].each { name ->
                if (zip.getEntry(name) == null) {
                    throw new GradleException("Cattail: ${path.name} has no ${name}")
                }
            }
            if (zip.getEntry('cattail/deployment.properties') != null) {
                throw new GradleException("Cattail: ${path.name} must not carry a deployment file")
            }
            // Allowlist for the two resource folders that once held deployment values: helper/
            // holds only the helperTargets directories, each with its binary and checksum, and
            // nothing ships under cattail/. As String, like helperResourceFiles: `in` compares
            // with the jar's String entry names, which a GString never equals.
            def helperEntries = ['helper/'] + helperTargets.collect { "helper/${it.dir}/" as String } +
                    helperResourceFiles.collect { "helper/$it" as String }
            def stray = zip.entries().toList()*.name.findAll {
                (it.startsWith('helper/') && !(it in helperEntries)) || it.startsWith('cattail/')
            }
            if (!stray.isEmpty()) {
                throw new GradleException("Cattail: ${path.name} carries ${stray}, which a generic jar must not " +
                        "hold (only ${helperEntries} under helper/, nothing under cattail/). Delete those files " +
                        "from mod/src/main/resources/, or build with scripts/build.sh, which clears helper/ and " +
                        "cattail/build.properties there first.")
            }
            def attributes = zip.manifest?.mainAttributes
            if (attributes == null) {
                throw new GradleException("Cattail: ${path.name} has no META-INF/MANIFEST.MF")
            }
            def mainClass = attributes.getValue('Main-Class')
            if (mainClass != 'net.kuching.cattail.deploy.Inject') {
                throw new GradleException("Cattail: ${path.name} Main-Class is ${mainClass}, " +
                        "expected net.kuching.cattail.deploy.Inject")
            }
            def marker = attributes.getValue('Cattail-Probe')
            if (probe && marker != 'true') {
                throw new GradleException("Cattail: ${path.name} is a -Pprobe build but has Cattail-Probe " +
                        "${marker}, expected true")
            }
            if (!probe && marker != null) {
                throw new GradleException("Cattail: ${path.name} has Cattail-Probe ${marker} without -Pprobe")
            }
            def metadata = zip.getEntry('META-INF/jarjar/metadata.json')
            if (metadata == null) {
                throw new GradleException("Cattail: ${path.name} has no META-INF/jarjar/metadata.json")
            }
            def json = zip.getInputStream(metadata).withCloseable { it.getText('UTF-8') }
            if (!(json =~ /"artifact"\s*:\s*"plasmo-voice"/)) {
                throw new GradleException("Cattail: ${path.name} jarjar metadata does not name artifact plasmo-voice")
            }
            def nested = zip.entries().toList().findAll {
                it.name.startsWith('META-INF/jarjar/') && it.name.endsWith('.jar')
            }
            if (nested.size() != 1) {
                throw new GradleException("Cattail: expected one nested jar under META-INF/jarjar/ in " +
                        "${path.name}, found ${nested*.name}")
            }
            def actual = zip.getInputStream(nested[0]).withCloseable { sha256Hex(it) }
            if (actual != expected) {
                throw new GradleException("Cattail: nested ${nested[0].name} sha256 ${actual} != expected ${expected}")
            }
        }
    }
}

// The no-voice jar is exactly the full jar minus noVoiceExcludes: same entry names in the same
// order, same bytes (the manifest included), nothing under META-INF/jarjar/.
tasks.register('verifyNoVoiceJar') {
    description = 'Checks that the no-voice jar is the full jar without the nested Plasmo Voice.'
    group = 'verification'
    dependsOn 'jar', 'noVoiceJar'
    def fullJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def noVoice = tasks.named('noVoiceJar', Jar).flatMap { it.archiveFile }
    def excludes = noVoiceExcludes
    inputs.file fullJar
    inputs.file noVoice
    inputs.property 'excludes', excludes
    doLast {
        def full = fullJar.get().asFile
        def slim = noVoice.get().asFile
        def dropped = { String name ->
            name.startsWith('META-INF/jarjar/') || name in excludes
        }
        new java.util.zip.ZipFile(full).withCloseable { source ->
            new java.util.zip.ZipFile(slim).withCloseable { copy ->
                // Each jar is written in its own reproducible order, so compare the sets.
                def want = source.entries().toList()*.name.findAll { !dropped(it) && !it.endsWith('/') }.sort()
                def got = copy.entries().toList()*.name.findAll { !it.endsWith('/') }.sort()
                if (got != want) {
                    throw new GradleException("Cattail: entries of ${slim.name} differ from ${full.name} without " +
                            "${excludes}: missing ${want - got}, extra ${got - want}")
                }
                want.each { name ->
                    def a = source.getInputStream(source.getEntry(name)).withCloseable { sha256Hex(it) }
                    def b = copy.getInputStream(copy.getEntry(name)).withCloseable { sha256Hex(it) }
                    if (a != b) {
                        throw new GradleException("Cattail: ${name} in ${slim.name} differs from ${full.name}")
                    }
                }
                if (copy.getEntry('META-INF/jarjar/metadata.json') != null) {
                    throw new GradleException("Cattail: ${slim.name} carries jarjar metadata")
                }
            }
        }
    }
}

// ExecOperations for an ad-hoc task: Project.javaexec is deprecated, and build.sh runs Gradle
// with --warning-mode=fail.
interface InjectedExecOps {
    @javax.inject.Inject
    ExecOperations getExecOps()
}

// Runs a built jar as an owner does, java -jar <jar> inject <file> --out <jar>, on a placeholder
// deployment file: the copy must carry exactly that entry, every other entry byte for byte, and
// still report the version. Once per shipped jar: verifyInject (full), verifyInjectNoVoice.
def registerVerifyInject = { String taskName, String jarTaskName ->
tasks.register(taskName) {
    description = "Runs inject from the ${jarTaskName} jar on a placeholder deployment file and checks the copy."
    group = 'verification'
    dependsOn jarTaskName
    def jarFile = tasks.named(jarTaskName, Jar).flatMap { it.archiveFile }
    def fixture = file('src/test/resources/deployment-fixture.properties')
    def injectedJar = layout.buildDirectory.file("tmp/${taskName}/injected.jar")
    def expectedVersion = mod_version
    def execOps = objects.newInstance(InjectedExecOps).execOps
    def launcher = javaToolchains.launcherFor(java.toolchain)
    inputs.file jarFile
    inputs.file fixture
    inputs.property 'expectedVersion', expectedVersion
    // java -jar <jar> <args> with the build's toolchain JDK; returns stdout, fails on a non-zero exit.
    def runJar = { File jar, List<String> args ->
        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()
        def result = execOps.exec {
            commandLine([launcher.get().executablePath.asFile.absolutePath, '-jar', jar.absolutePath] + args)
            standardOutput = stdout
            errorOutput = stderr
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            throw new GradleException("Cattail: java -jar ${jar.name} ${args.join(' ')} exited " +
                    "${result.exitValue}: ${stderr.toString('UTF-8').trim()}")
        }
        stdout.toString('UTF-8')
    }
    doLast {
        def built = jarFile.get().asFile
        def injected = injectedJar.get().asFile
        // inject replaces an existing output only when it is named by --out; start from none.
        java.nio.file.Files.deleteIfExists(injected.toPath())
        injected.parentFile.mkdirs()
        runJar(built, ['inject', fixture.absolutePath, '--out', injected.absolutePath])

        def resource = 'cattail/deployment.properties'
        def expectedEntry = 'authkey=tskey-auth-EXAMPLE\ntag=tag:example\nspecs.prefix=EXAMPLE\n'
        new java.util.zip.ZipFile(built).withCloseable { source ->
            new java.util.zip.ZipFile(injected).withCloseable { copy ->
                def entry = copy.getEntry(resource)
                if (entry == null) {
                    throw new GradleException("Cattail: ${injected.name} has no ${resource}")
                }
                def actualEntry = copy.getInputStream(entry).withCloseable { new String(it.readAllBytes(), 'UTF-8') }
                if (actualEntry != expectedEntry) {
                    throw new GradleException("Cattail: ${resource} in ${injected.name} is " +
                            "${actualEntry.inspect()}, expected ${expectedEntry.inspect()}")
                }
                def sourceNames = source.entries().toList()*.name
                def otherNames = copy.entries().toList()*.name - resource
                if (otherNames != sourceNames) {
                    throw new GradleException("Cattail: entries of ${injected.name} other than ${resource} differ " +
                            "from ${built.name}: missing ${sourceNames - otherNames}, extra " +
                            "${otherNames - sourceNames} (both empty: a different order)")
                }
                sourceNames.each { name ->
                    def want = source.getInputStream(source.getEntry(name)).withCloseable { sha256Hex(it) }
                    def got = copy.getInputStream(copy.getEntry(name)).withCloseable { sha256Hex(it) }
                    if (got != want) {
                        throw new GradleException("Cattail: ${name} in ${injected.name} differs from ${built.name}")
                    }
                }
            }
        }

        def version = runJar(injected, ['--version'])
        if (version != expectedVersion + '\n') {
            throw new GradleException("Cattail: java -jar ${injected.name} --version printed ${version.inspect()}, " +
                    "expected ${(expectedVersion + '\n').inspect()}")
        }
    }
}
}
registerVerifyInject('verifyInject', 'jar')
registerVerifyInject('verifyInjectNoVoice', 'noVoiceJar')

tasks.named('check') {
    dependsOn 'verifyBundledVoiceJar', 'verifyNoVoiceJar', 'verifyInject', 'verifyInjectNoVoice'
}

// The README and its images, so ModLogoTest can check the README shows the jar's logo,
// update.json, so UpdateJsonTest can pin it to mod_version, and scripts/build.sh, so
// HelperTargetBuildListTest can match HelperTarget to its HELPER_TARGETS.
processTestResources {
    from(rootProject.file('../README.md')) {
        into 'repo'
    }
    from(rootProject.file('../scripts/build.sh')) {
        into 'repo/scripts'
    }
    from(rootProject.file('../update.json')) {
        into 'repo'
    }
    from(rootProject.file('../.github')) {
        into 'repo/.github'
    }
}

test {
    useJUnitPlatform()
    // As some launchers do: InetAddress.getLoopbackAddress() is then ::1, so the tests prove the
    // redirect target is the helper's explicit 127.0.0.1 listener.
    systemProperty 'java.net.preferIPv6Addresses', 'true'
}
